        options: ["Eficiencia de desempeño", "Pertinencia funcional", "Corrección funcional", "Completitud funcional"],
        answer: 2,
        exp: "Es un fallo de 'Corrección funcional' porque la función existe, pero no produce los resultados matemáticos o lógicos correctos."
    },
    {
        q: "Una metodología lineal, rígida, donde las pruebas se realizan hasta el final de la fase de implementación:",
        options: ["Scrum", "Prototipado", "Espiral", "Cascada (Waterfall)"],
        answer: 3,
        exp: "El modelo en Cascada es secuencial y las pruebas de validación ocurren tarde en el ciclo."
    },
    {
        q: "¿Qué norma usarías para estandarizar CÓMO debe trabajar tu equipo (fases, documentación, etc.)?",
        options: ["ISO 9000", "ISO/IEC 25010", "ISO/IEC 12207", "ISO 27001"],
        answer: 2,
        exp: "ISO/IEC 12207 define los procesos del ciclo de vida del software (el CÓMO), mientras 25010 define las características del producto."
    },
    {
        q: "Tener el código organizado en componentes independientes para que un cambio no afecte al resto se llama:",
        options: ["Reusabilidad", "Modularidad", "Tolerancia a fallos", "Analizabilidad"],
        answer: 1,
        exp: "La Modularidad es parte de la Mantenibilidad y reduce el 'efecto dominó' al modificar código."
    },
    {
        q: "¿Qué busca la característica de Portabilidad?",
        options: ["Que el sistema cargue en menos de 2 segundos", "Transferir el sistema de un entorno a otro", "Intercambiar datos con APIs", "Evitar caídas de servidor"],
        answer: 1,
        exp: "Portabilidad incluye Adaptabilidad, Instalabilidad y Reemplazabilidad en distintos entornos."
    },
    {
        q: "En XP (Extreme Programming), ¿cuál de las siguientes es una práctica clave?",
        options: ["Reunión de retrospectiva mensual", "Diseño complejo desde el inicio", "Programación en pareja", "Documentación exhaustiva antes de codificar"],
        answer: 2,
        exp: "XP promueve la Programación en pareja (Pair programming), pruebas continuas y diseño simple."
    },
    {
        q: "Si un software tiene botones diminutos amontonados y 15 colores chillones, los usuarios se quejan de la:",
        options: ["Estética de la interfaz", "Adecuación reconocible", "Operabilidad", "Capacidad de aprendizaje"],
        answer: 0,
        exp: "La Estética (Usabilidad) exige información presentada de forma agradable, ordenada y jerárquica."
    },
    {
        q: "El RPO (Recovery Point Objective) y el RTO (Recovery Time Objective) están ligados a la subcaracterística de:",
        options: ["Madurez", "Capacidad de recuperación", "Tolerancia a fallos", "Disponibilidad"],
        answer: 1,
        exp: "La Capacidad de recuperación determina cuánto tardas en volver (RTO) y cuántos datos toleras perder (RPO) tras un fallo."
    },
    {
        q: "Dos sistemas (Ej. Antivirus y Juego) corren en la misma PC sin afectarse el rendimiento. Esto es:",
        options: ["Interoperabilidad", "Coexistencia", "Eficiencia", "Adaptabilidad"],
        answer: 1,
        exp: "La Coexistencia (Compatibilidad) significa compartir recursos sin causar efectos perjudiciales al otro."
    },
    {

        options: ["Scrum", "Prototipado", "Modelo en V", "Lean"],

    },
    {
        q: "¿Qué norma implementarías junto con la ISO 25010 para establecer políticas, controles de acceso y un correcto análisis de riesgos (SGSI)?",

        answer: 2,
        exp: "La ISO/IEC 27001 se enfoca en el Sistema de Gestión de Seguridad de la Información (SGSI)."
    },
    {
        q: "¿Cuál de las siguientes es una dimensión de la Seguridad del Software según ISO 25010?",
        options: ["Adaptabilidad", "No repudio", "Tolerancia a fallos", "Madurez"],
        answer: 1,
        exp: "Las dimensiones de seguridad (ISO 25010) son Confidencialidad, Integridad, No repudio, Responsabilidad y Autenticidad."
    }
];

// --- APP LOGIC ---

let completedModules = JSON.parse(localStorage.getItem('calidad_sw_progress')) || [];
let currentQuiz = [];
let currentQuizIndex = 0;
let quizScore = 0;
let flashcardIndex = 0;

// Initialize App
function initApp() {
    renderSidebar();
    updateProgress();
    loadView('fundamentos');
}

// Navigation
function renderSidebar() {
    const navContainer = document.getElementById('nav-container');
    navContainer.innerHTML = '';
    
    // Auto-generate topic links
    for (const key in courseData) {
        navContainer.innerHTML += `
            <button onclick="loadView('${key}')" id="nav-${key}" class="nav-item w-full text-left px-6 py-3 text-sm text-gray-700 flex items-center justify-between">
                <span>${courseData[key].title}</span>
                ${completedModules.includes(key) ? '<svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : ''}
            </button>
        `;
    }
    
    // Add tools
    navContainer.innerHTML += `
        <div class="mt-4 mb-2 px-6 text-xs font-bold text-gray-400 uppercase tracking-wider">Herramientas</div>
        <button onclick="loadFlashcards()" id="nav-flashcards" class="nav-item w-full text-left px-6 py-3 text-sm text-gray-700"><span class="flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg> Flashcards</span></button>
        <button onclick="startExam()" id="nav-exam" class="nav-item w-full text-left px-6 py-3 text-sm text-gray-700"><span class="flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg> Simulador de Examen</span></button>
    `;
}

function updateActiveNav(id) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    const activeEl = document.getElementById(`nav-${id}`);
    if(activeEl) activeEl.classList.add('active');
    
    // Update mobile header
    const title = activeEl ? activeEl.innerText : 'Calidad de Software';
    document.getElementById('mobile-header-title').innerText = title;
}

function toggleMenu() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('mobile-menu-overlay');
    
    if (sidebar.classList.contains('-translate-x-full')) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
    } else {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
    }
}

// Update Progress
function updateProgress() {
    const total = Object.keys(courseData).length;
    const completed = completedModules.length;
    const percentage = Math.round((completed / total) * 100);
    
    document.getElementById('overall-progress-bar').style.width = `${percentage}%`;
    document.getElementById('overall-progress-text').innerText = `${percentage}% Completado`;
}

function markAsStudied(id) {
    if (!completedModules.includes(id)) {
        completedModules.push(id);
        localStorage.setItem('calidad_sw_progress', JSON.stringify(completedModules));
        renderSidebar();
        updateProgress();
        updateActiveNav(id);
        
        // Show subtle notification (optional)
        const btn = document.getElementById('btn-studied');
        btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Estudiado';
        btn.classList.replace('bg-blue-600', 'bg-green-600');
        btn.classList.replace('hover:bg-blue-700', 'hover:bg-green-700');
    }
}

// Content Rendering
function loadView(topicId) {
    updateActiveNav(topicId);
    if(window.innerWidth < 1024) toggleMenu(); // auto-close on mobile
    
    const topic = courseData[topicId];
    const isCompleted = completedModules.includes(topicId);
    
    let html = `
        <div class="fade-in pb-20">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                <h2 class="text-3xl font-bold text-gray-800">${topic.title}</h2>
                <button id="btn-studied" onclick="markAsStudied('${topicId}')" class="flex items-center gap-2 px-4 py-2 ${isCompleted ? 'bg-green-600 hover:bg-green-700' : 'bg-blue-600 hover:bg-blue-700'} text-white rounded-lg shadow transition-colors focus:outline-none">
                    ${isCompleted ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Estudiado' : '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Marcar como Estudiado'}
                </button>
            </div>

            <!-- Explicación -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-6">
                <h3 class="text-lg font-bold text-blue-800 mb-3 flex items-center gap-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Explicación Sencilla</h3>
                <p class="text-gray-700 leading-relaxed">${topic.explanation}</p>
            </div>

            <!-- Resumen -->
            <div class="bg-blue-50 p-6 rounded-xl mb-6 border border-blue-100">
                <h3 class="text-lg font-bold text-blue-800 mb-3 flex items-center gap-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg> Puntos Clave</h3>
                <ul class="space-y-2">
                    ${topic.summary.map(s => `<li class="flex items-start gap-2"><span class="text-blue-500 font-bold mt-0.5">•</span> <span class="text-gray-700">${s}</span></li>`).join('')}
                </ul>
            </div>

            <!-- Conceptos & Ejemplos -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <h3 class="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2"><svg class="w-5 h-5 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg> Conceptos Importantes</h3>
                    <div class="space-y-4">
                        ${topic.concepts.map(c => `
                            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100 border-l-4 border-l-yellow-400">
                                <h4 class="font-bold text-gray-900">${c.term}</h4>
                                <p class="text-sm text-gray-600 mt-1">${c.def}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2"><svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg> Ejemplo Práctico</h3>
                    <div class="bg-emerald-50 p-5 rounded-xl border border-emerald-100 text-gray-700 h-full">
                        ${topic.examples}
                    </div>
                </div>
            </div>
            
            <div class="mt-8 pt-6 border-t border-gray-200 flex justify-end">
                 <button onclick="loadNextTopic('${topicId}')" class="flex items-center gap-2 text-blue-600 font-semibold hover:text-blue-800">
                    Siguiente Tema <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                 </button>
            </div>
        </div>
    `;
    
    document.getElementById('main-content').innerHTML = html;
}

function loadNextTopic(currentId) {
    const keys = Object.keys(courseData);
    const currentIndex = keys.indexOf(currentId);
    if (currentIndex < keys.length - 1) {
        loadView(keys[currentIndex + 1]);
    } else {
        loadFlashcards();
    }
}

// Flashcards
function loadFlashcards() {
    updateActiveNav('flashcards');
    if(window.innerWidth < 1024) toggleMenu();
    flashcardIndex = 0;
    
    renderFlashcardUI();
}

function renderFlashcardUI() {
    const card = flashcardsData[flashcardIndex];
    
    let html = `
        <div class="fade-in max-w-2xl mx-auto pb-10">
            <div class="text-center mb-6">
                <h2 class="text-3xl font-bold text-gray-800">Tarjetas de Estudio</h2>
                <p class="text-gray-500 mt-2">Haz clic en la tarjeta para ver la respuesta.</p>
                <div class="mt-4 text-sm font-semibold text-blue-600">Tarjeta ${flashcardIndex + 1} de ${flashcardsData.length}</div>
            </div>

            <div class="flip-card mx-auto w-full" onclick="this.classList.toggle('flipped')">
                <div class="flip-card-inner shadow-lg">
                    <div class="flip-card-front flex-col text-center">
                        <span class="text-blue-500 font-bold mb-4 uppercase tracking-widest text-xs">Concepto / Pregunta</span>
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800">${card.q}</h3>
                    </div>
                    <div class="flip-card-back flex-col text-center">
                        <span class="text-blue-600 font-bold mb-4 uppercase tracking-widest text-xs">Respuesta</span>
                        <p class="text-lg text-gray-800 font-medium">${card.a}</p>
                    </div>
                </div>
            </div>

            <div class="flex justify-between mt-8">
                <button onclick="prevCard()" class="px-6 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition font-medium ${flashcardIndex === 0 ? 'opacity-50 cursor-not-allowed' : ''}" ${flashcardIndex === 0 ? 'disabled' : ''}>Anterior</button>
                <button onclick="nextCard()" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium ${flashcardIndex === flashcardsData.length - 1 ? 'opacity-50 cursor-not-allowed' : ''}" ${flashcardIndex === flashcardsData.length - 1 ? 'disabled' : ''}>Siguiente</button>
            </div>
        </div>
    `;
    
    document.getElementById('main-content').innerHTML = html;
}

function nextCard() {
    if (flashcardIndex < flashcardsData.length - 1) {
        flashcardIndex++;
        renderFlashcardUI();
    }
}

function prevCard() {
    if (flashcardIndex > 0) {
        flashcardIndex--;
        renderFlashcardUI();
    }
}

// EXAM SIMULATOR
function startExam() {
    updateActiveNav('exam');
    if(window.innerWidth < 1024) toggleMenu();
    
    // Shuffle and pick 10 questions for the exam
    currentQuiz = [...quizPool].sort(() => 0.5 - Math.random()).slice(0, 10);
    currentQuizIndex = 0;
    quizScore = 0;
    
    renderExamIntro();
}

function renderExamIntro() {
    let html = `
        <div class="fade-in max-w-2xl mx-auto text-center py-10">
            <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            </div>
            <h2 class="text-3xl font-bold text-gray-800 mb-4">Simulador de Examen</h2>
            <p class="text-gray-600 mb-8">Pondremos a prueba tus conocimientos sobre ISO 25010, ISO 12207 y Metodologías. Son 10 preguntas de opción múltiple aleatorias.</p>
            <button onclick="renderExamQuestion()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition transform hover:-translate-y-1">Comenzar Examen</button>
        </div>
    `;
    document.getElementById('main-content').innerHTML = html;
}

function renderExamQuestion() {
    const q = currentQuiz[currentQuizIndex];
    const progress = ((currentQuizIndex) / currentQuiz.length) * 100;
    
    let html = `
        <div class="fade-in max-w-3xl mx-auto pb-10">
            <div class="mb-6 flex items-center justify-between text-sm font-medium text-gray-500">
                <span>Pregunta ${currentQuizIndex + 1} de ${currentQuiz.length}</span>
                <span>Progreso</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2 mb-8">
                <div class="bg-blue-600 h-2 rounded-full" style="width: ${progress}%"></div>
            </div>

            <div class="bg-white p-6 md:p-8 rounded-xl shadow-sm border border-gray-200">
                <h3 class="text-xl font-bold text-gray-800 mb-6">${q.q}</h3>
                <div class="space-y-3" id="quiz-options">
                    ${q.options.map((opt, i) => `
                        <button onclick="selectExamAnswer(${i})" class="w-full text-left p-4 rounded-lg border-2 border-gray-100 hover:border-blue-400 hover:bg-blue-50 transition-colors focus:outline-none font-medium text-gray-700">
                            ${opt}
                        </button>
                    `).join('')}
                </div>
                <div id="quiz-feedback" class="mt-6 hidden p-4 rounded-lg"></div>
                <div class="mt-6 text-right hidden" id="quiz-next-container">
                    <button onclick="nextExamQuestion()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700">Continuar</button>
                </div>
            </div>
        </div>
    `;
    
    document.getElementById('main-content').innerHTML = html;
}

function selectExamAnswer(selectedIndex) {
    // Prevent multiple clicks
    const btns = document.querySelectorAll('#quiz-options button');
    btns.forEach(b => { b.disabled = true; b.classList.remove('hover:border-blue-400', 'hover:bg-blue-50'); });
    
    const q = currentQuiz[currentQuizIndex];
    const isCorrect = selectedIndex === q.answer;
    
    if (isCorrect) quizScore++;
    
    // Highlight answers
    btns[selectedIndex].classList.add(isCorrect ? 'border-green-500' : 'border-red-500', isCorrect ? 'bg-green-50' : 'bg-red-50');
    if(!isCorrect) btns[q.answer].classList.add('border-green-500', 'bg-green-50');
    
    // Show Feedback
    const fb = document.getElementById('quiz-feedback');
    fb.classList.remove('hidden');
    fb.classList.add(isCorrect ? 'bg-green-100' : 'bg-red-100', isCorrect ? 'text-green-800' : 'text-red-800');
    fb.innerHTML = `
        <div class="font-bold flex items-center gap-2 mb-1">
            ${isCorrect ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> ¡Correcto!' : '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg> Incorrecto'}
        </div>
        <p class="text-sm">${q.exp}</p>
    `;
    
    document.getElementById('quiz-next-container').classList.remove('hidden');
}

function nextExamQuestion() {
    currentQuizIndex++;
    if (currentQuizIndex < currentQuiz.length) {
        renderExamQuestion();
    } else {
        renderExamResults();
    }
}

function renderExamResults() {
    const percentage = Math.round((quizScore / currentQuiz.length) * 100);
    let message = "";
    let color = "";
    
    if (percentage >= 80) {
        message = "¡Excelente trabajo! Estás muy bien preparado para el examen.";
        color = "text-green-600";
    } else if (percentage >= 60) {
        message = "Buen esfuerzo, pero necesitas repasar algunos conceptos clave.";
        color = "text-yellow-600";
    } else {
        message = "Te recomendamos volver a leer los apuntes y utilizar las flashcards.";
        color = "text-red-600";
    }

    let html = `
        <div class="fade-in max-w-2xl mx-auto text-center py-10">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Resultados del Examen</h2>
            
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 mb-8">
                <div class="text-6xl font-black ${color} mb-2">${percentage}%</div>
                <div class="text-gray-500 font-medium">Acertaste ${quizScore} de ${currentQuiz.length} preguntas</div>
                <p class="mt-6 text-gray-700 text-lg">${message}</p>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button onclick="startExam()" class="px-6 py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 shadow transition">Intentar de nuevo</button>
                <button onclick="loadView('fundamentos')" class="px-6 py-3 bg-white text-gray-700 font-bold border border-gray-300 rounded-lg hover:bg-gray-50 transition">Volver al temario</button>
            </div>
        </div>
    `;
    document.getElementById('main-content').innerHTML = html;
}

// Run App
window.onload = initApp;
</script>
</body>
</html>
